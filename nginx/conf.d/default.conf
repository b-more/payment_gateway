# Hostname routing (§2.3). TLS termination, HSTS, security headers (SEC-N4),
# HTTP→HTTPS redirect (TLS-2) and the ACME HTTP-01 challenge for Certbot.

# ── HTTP (80): ACME challenge + redirect everything else to HTTPS ──
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Let's Encrypt HTTP-01 challenge (served from the shared webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Landing site: apex + www (+ dev) → ic-landing ──
server {
    listen 443 ssl;
    http2 on;
    server_name instacompayzm.com www.instacompayzm.com dev.instacompayzm.com;

    include /etc/nginx/conf.d/tls.inc;
    include /etc/nginx/conf.d/security_headers.inc;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location / {
        set $upstream ic-landing:8040;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
}

# ── Admin portal → ic-admin ──
server {
    listen 443 ssl;
    http2 on;
    server_name admin.instacompayzm.com admin.dev.instacompayzm.com;

    include /etc/nginx/conf.d/tls.inc;
    include /etc/nginx/conf.d/security_headers.inc;
    # SEC-N3: the admin console controls money — optionally restrict to office/VPN:
    #   allow 102.23.120.0/24; allow 76.13.57.29; deny all;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://api.instacompayzm.com; frame-ancestors 'none'" always;

    location / {
        set $upstream ic-admin:8010;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
}

# ── Merchant portal → ic-merchant ──
server {
    listen 443 ssl;
    http2 on;
    server_name merchants.instacompayzm.com merchants.dev.instacompayzm.com;

    include /etc/nginx/conf.d/tls.inc;
    include /etc/nginx/conf.d/security_headers.inc;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://api.instacompayzm.com; frame-ancestors 'none'" always;

    location / {
        set $upstream ic-merchant:8020;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
}

# ── API gateway → ic-api ──
server {
    listen 443 ssl;
    http2 on;
    server_name api.instacompayzm.com api.dev.instacompayzm.com;

    include /etc/nginx/conf.d/tls.inc;
    include /etc/nginx/conf.d/security_headers.inc;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Temporary unlisted download (Z100 POS APK), served from the certbot webroot.
    # Remove this block (and the file) once the terminal is provisioned.
    location /dl/ {
        alias /var/www/certbot/dl/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    # Public HTML receipt page (the receipt QR target). Relaxed CSP so the inline
    # styles render (the API default is default-src 'none').
    location ^~ /v1/receipts/ {
        limit_req zone=api burst=40 nodelay;
        set $upstream_receipt ic-api:8030;
        proxy_pass http://$upstream_receipt;
        include /etc/nginx/conf.d/proxy_headers.inc;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; frame-ancestors 'none'" always;
    }

    # Tight limit on auth (login/OTP) to blunt brute force (SEC-A5).
    location /v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        set $upstream_auth ic-api:8030;
        proxy_pass http://$upstream_auth;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Swagger UI (interactive reference). The API default CSP is `default-src
    # 'none'`, which blanks the UI — relax it to same-origin just for /docs and
    # its assets (and /docs-json). Re-add the base security headers since a
    # location with its own add_header does not inherit the server's.
    location ^~ /docs {
        limit_req zone=api burst=40 nodelay;
        set $upstream_docs ic-api:8030;
        proxy_pass http://$upstream_docs;
        include /etc/nginx/conf.d/proxy_headers.inc;
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        set $upstream ic-api:8030;
        proxy_pass http://$upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
}

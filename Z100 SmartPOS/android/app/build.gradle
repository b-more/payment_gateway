plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.instacompay.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.instacompay.pos"
        minSdk 23          // matches the ZCS demo
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // Gateway base URL — override for staging/dev builds if needed.
        buildConfigField "String", "GATEWAY_BASE_URL", "\"https://api.instacompayzm.com\""
        // Card/EMV is scaffolded but DISABLED (no card acquirer yet). Do not flip
        // to true without an acquirer host + injected PIN keys + certification.
        buildConfigField "boolean", "CARD_ENABLED", "false"
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // ZCS SmartPos + EMV SDK (vendored AARs).
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}

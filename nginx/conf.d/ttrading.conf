# T-Trading Liquor Store — served through the VPS edge proxy (Instacompay ic-nginx).
#
# Prerequisites
#   1. Certificate (HTTP-01 through the shared ACME webroot on port 80):
#        docker exec ic-certbot certbot certonly --webroot -w /var/www/certbot \
#          --cert-name ttradingliquorstore.com -d ttradingliquorstore.com -d www.ttradingliquorstore.com \
#          --key-type ecdsa --non-interactive --agree-tos
#   2. tt-web attached to the `ic-public` network:  docker compose up -d web   (see compose.yaml)
#
# Install (zero downtime; the copy in the gateway repo keeps it across ic-nginx rebuilds)
#   cp deploy/ic-nginx/ttrading.conf /var/www/html/gateway/nginx/conf.d/ttrading.conf
#   docker cp deploy/ic-nginx/ttrading.conf ic-nginx:/etc/nginx/conf.d/ttrading.conf
#   docker exec ic-nginx nginx -t && docker exec ic-nginx nginx -s reload
#
# HTTP → HTTPS redirect and the ACME challenge are already handled by ic-nginx's default port-80 server.

server {
    listen 443 ssl;
    http2 on;
    server_name www.ttradingliquorstore.com;

    ssl_certificate     /etc/letsencrypt/live/ttradingliquorstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ttradingliquorstore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://ttradingliquorstore.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ttradingliquorstore.com;

    ssl_certificate     /etc/letsencrypt/live/ttradingliquorstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ttradingliquorstore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS, nosniff, frame DENY, referrer policy. No CSP yet: Alpine.js needs 'unsafe-eval'. MVP: add CSP with the CSP build of Alpine.
    include /etc/nginx/conf.d/security_headers.inc;

    client_max_body_size 12m; # product CSV uploads

    # Brute-force protection on both login endpoints (zone defined in ic-nginx nginx.conf).
    location = /login {
        limit_req zone=auth burst=10 nodelay;
        set $tt_upstream tt-web:80;
        proxy_pass http://$tt_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /api/v1/auth/login {
        limit_req zone=auth burst=10 nodelay;
        set $tt_upstream tt-web:80;
        proxy_pass http://$tt_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location / {
        set $tt_upstream tt-web:80; # resolved lazily, so ic-nginx still starts if T-Trading is down
        proxy_pass http://$tt_upstream;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
}

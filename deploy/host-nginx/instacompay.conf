# Instacompay — host Nginx. Proxies the Instacompay hostnames to the loopback
# app containers (ic-landing:8040, ic-admin:8010, ic-merchant:8020, ic-api:8030).
# Behind Cloudflare (Full Strict): the true client IP is $http_cf_connecting_ip,
# forwarded to the apps as X-Real-IP / X-Forwarded-For / CF-Connecting-IP (DNS-2).
# Additive — does not touch the other sites on this box.

map $http_upgrade $ic_conn_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS (Cloudflare also enforces this). ACME path kept for HTTP-01 fallback.
server {
    listen 80;
    listen [::]:80;
    server_name instacompayzm.com www.instacompayzm.com admin.instacompayzm.com merchants.instacompayzm.com api.instacompayzm.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── Landing: apex + www -> ic-landing ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name instacompayzm.com www.instacompayzm.com;

    ssl_certificate     /etc/letsencrypt/live/instacompayzm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/instacompayzm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ic_conn_upgrade;
        proxy_read_timeout 60s;
    }
}


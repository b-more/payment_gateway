user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Edge rate limiting (complements per-account app limits, SEC-API6).
    limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Docker's embedded DNS — lets upstreams resolve lazily (via $variables in
    # proxy_pass) so Nginx starts even if an app container is briefly down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Real client IP behind Cloudflare proxy (EXP-6, DNS-2) ── ENABLED.
    # App records are Proxied (orange-cloud); trust Cloudflare and read the true
    # client IP from CF-Connecting-IP (needed for IP whitelist + audit IPs).
    include /etc/nginx/conf.d/cloudflare-realip.inc;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Permanent release signing. The keystore + passwords live OUTSIDE the repo.
// Point the KEYSTORE_PROPERTIES env var at a keystore.properties file whose
// `storeFile` is resolved relative to that file's directory. If absent (e.g. a
// contributor without the keystore), builds fall back to the debug signing.
def keystorePropertiesFile = file(System.getenv('KEYSTORE_PROPERTIES') ?: "${rootDir}/keystore.properties")
def hasKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.instacompay.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.instacompay.pos"
        minSdk 21          // lowered from 23 for older terminals (see README: EncryptedSharedPreferences needs 23+ at runtime)
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // Gateway base URL — override for staging/dev builds if needed.
        buildConfigField "String", "GATEWAY_BASE_URL", "\"https://api.instacompayzm.com\""
        // Card/EMV is scaffolded but DISABLED (no card acquirer yet). Do not flip
        // to true without an acquirer host + injected PIN keys + certification.
        buildConfigField "boolean", "CARD_ENABLED", "false"
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile new File(keystorePropertiesFile.parentFile, keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    // Package native libs the legacy way (compressed + extracted at install →
    // android:extractNativeLibs="true"). Modern AGP defaults to uncompressed libs,
    // which some older / OEM POS installers reject with "App not installed".
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        // All builds use the permanent release cert and are non-debuggable, so a
        // stable signature means `adb install -r` updates in place forever.
        debug {
            if (hasKeystore) signingConfig signingConfigs.release
            debuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) signingConfig signingConfigs.release
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // ZCS SmartPos + EMV SDK (vendored AARs).
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
